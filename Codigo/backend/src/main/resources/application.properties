spring.application.name=moeda-estudantil

# PostgreSQL — usa env var injetada pelo Docker, senão usa configuração local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/moeda_estudantil}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize data.sql after schema creation
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Server port
server.port=8080

# RabbitMQ — usa env var injetada pelo Docker, senão usa configuração local
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Email (JavaMailSender) — substitua pelas suas credenciais reais ou defina via env var
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:seuemail@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:sua-senha-de-app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# URL do frontend (usada nos links dos e-mails)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# CORS — lista separada por vírgula; sobrescreva via env var em produção
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}
